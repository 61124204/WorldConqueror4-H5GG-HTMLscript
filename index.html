    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Microsoft YaHei",sans-serif;color:var(--text);-webkit-user-select:none;user-select:none}
    .detail{position:absolute;right:12px;top:50%;width:min(300px,calc(100vw - 24px));height:350px;padding:8px;overflow:hidden;border:1px solid rgba(113,197,255,.34);border-radius:25px;background:linear-gradient(145deg,rgba(44,52,71,.91),rgba(24,30,44,.94));box-shadow:0 20px 48px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.2),0 0 23px rgba(77,163,255,.16);backdrop-filter:blur(22px) saturate(135%);opacity:0;pointer-events:none;transform:translateY(-50%) translateX(10px) scale(.97);transition:.2s ease}.detail:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent)}.detail.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
    .loading{position:absolute;inset:0;z-index:5;display:grid;place-content:center;gap:10px;border-radius:25px;background:rgba(20,27,40,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .16s}.loading.show{opacity:1;pointer-events:auto}.spinner{width:34px;height:34px;margin:auto;border:3px solid rgba(255,255,255,.18);border-top-color:var(--blue);border-right-color:#a49bff;border-radius:50%;animation:spin .75s linear infinite}.loading span{font-size:11px;color:#dcecff;letter-spacing:.08em}@keyframes spin{to{transform:rotate(360deg)}}
    .detail-head{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 7px}.detail-head h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.02em}.head-actions{display:flex;gap:6px}.head-actions button{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.09);color:var(--muted);font-size:17px;line-height:1;cursor:pointer}.head-actions #asset-reload{font-size:15px;transform:translateY(-.5px)}.head-actions #back{display:none;font-size:16px}.head-actions #back.show{display:inline-flex}.head-actions #exit:hover{border-color:rgba(255,111,111,.55);color:#ffb2b2;background:rgba(255,95,95,.12)}.desc{margin:0;padding:0 10px 8px;color:var(--muted);font-size:11px}.actions{max-height:248px;overflow-y:auto;padding-right:3px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:none;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}.actions::-webkit-scrollbar{width:4px}.actions::-webkit-scrollbar-thumb{border-radius:8px;background:rgba(255,255,255,.3)}.action{position:relative;display:block;width:100%;min-height:58px;margin-bottom:7px;padding:10px 43px 10px 51px;border:1px solid rgba(255,255,255,.13);border-radius:17px;background:rgba(10,14,25,.22);color:var(--text);text-align:left;cursor:pointer;transition:.16s}.action:last-child{margin-bottom:0}.action:before{content:"";position:absolute;left:10px;top:50%;width:31px;height:31px;transform:translateY(-50%);border-radius:50%;background-image:var(--wc-icons);background-repeat:no-repeat;background-size:120px 150px;background-position:var(--icon-x,0) var(--icon-y,0);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.action.has-portrait:before{width:32px;height:32px;background-image:url('https://raw.githubusercontent.com/61124204/WorldConqueror4-H5GG-HTMLscript/main/tacticalmap.webp');background-size:585.143px 765.714px;background-position:var(--portrait-x) var(--portrait-y);box-shadow:0 0 0 1px rgba(255,255,255,.32),0 2px 3px rgba(0,0,0,.45)}.icon-home{--icon-x:0;--icon-y:0}.icon-outside,.icon-general{--icon-x:-30px;--icon-y:0}.icon-inside,.icon-unit{--icon-x:-30px;--icon-y:-120px}.icon-record,.icon-medal{--icon-x:0;--icon-y:-90px}.icon-trade,.icon-resource{--icon-x:-60px;--icon-y:0}.icon-material{--icon-x:0;--icon-y:-60px}.icon-victory{--icon-x:0;--icon-y:0}.icon-general-card{--icon-x:-30px;--icon-y:-30px}.action:after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-52%);color:#aeb6c5;font-size:22px;font-weight:300}.action:hover{background:rgba(255,255,255,.09)}.action.on{border-color:rgba(77,163,255,.6);background:rgba(77,163,255,.14)}.action.on:after{content:"✓";color:var(--green);font-size:14px;font-weight:700}.action strong{display:block;font-size:13px;font-weight:550}.action small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.action.on small{color:#bddcff}.action.on small:after{content:" · 已启用";color:var(--green)}
    .search-form{padding:1px}.general-search{position:sticky;top:0;z-index:4;padding:1px 1px 6px;background:rgba(33,40,56,.98)}.search-form label{display:block;margin:0 2px 7px;color:var(--muted);font-size:11px}.search-form input{width:100%;height:39px;padding:0 12px;border:1px solid rgba(255,255,255,.17);border-radius:13px;outline:0;background:rgba(9,13,24,.38);color:var(--text);font:inherit;font-size:13px;-webkit-user-select:text;user-select:text}.search-form input:focus{border-color:rgba(77,163,255,.7);box-shadow:0 0 0 3px rgba(77,163,255,.12)}.convert-preview{margin:8px 1px 9px;padding:9px 11px;border-radius:13px;background:rgba(77,163,255,.1);color:#c8e3ff;font-size:11px}.convert-preview b{color:#fff;font-weight:600}.form-actions{display:flex;gap:7px}.form-actions button{flex:1;height:35px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.12);color:var(--text);font-size:11px;cursor:pointer}.form-actions button.primary{border-color:rgba(77,163,255,.52);background:linear-gradient(135deg,#438fe3,#6463d8)}.result-note{margin:8px 2px 0;color:var(--muted);font-size:11px}.result-note b{color:var(--text)}
    .memory-list{margin:1px;overflow:hidden;border:1px solid rgba(255,255,255,.11);border-radius:12px}.memory-row{display:grid;grid-template-columns:58px 1fr;gap:7px;padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.08);font-size:10px;line-height:1.35}.memory-row:last-child{border-bottom:0}.memory-row b{color:#9fcfff;font-weight:600}.memory-row code{color:#e5ebf7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}.memory-row.focus{background:rgba(77,163,255,.18);box-shadow:inset 3px 0 var(--blue)}.memory-row.focus b{color:#fff}

    .asset-loader{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px;border-radius:25px;background:rgba(19,25,38,.96);backdrop-filter:blur(12px);transition:opacity .22s ease}.asset-loader.done{opacity:0;pointer-events:none}.asset-card{width:100%;padding:17px 15px 15px;border:1px solid rgba(131,193,255,.28);border-radius:17px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px rgba(255,255,255,.13)}.asset-title{font-size:14px;font-weight:650}.asset-state{min-height:17px;margin-top:8px;color:var(--muted);font-size:11px}.asset-track{height:7px;margin-top:12px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.12)}.asset-bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#4da3ff,#8f82ff);box-shadow:0 0 12px rgba(77,163,255,.62);transition:width .2s ease}.asset-count{margin-top:7px;color:#bcdcff;font-size:10px;text-align:right}

<body>
  <section class="detail" id="detail" aria-live="polite">
    <header class="detail-head"><h1 id="title">功能分区</h1><div class="head-actions"><button id="back" type="button" aria-label="返回">‹</button><button id="asset-reload" type="button" aria-label="重新下载素材">⇩</button><button id="minimize" type="button" aria-label="最小化">−</button><button id="exit" type="button" aria-label="彻底关闭">×</button></div></header>
    <p class="desc" id="desc"></p>
    <main class="actions" id="actions" aria-label="上下滑动选择功能"></main>
    <div class="loading" id="loading" aria-live="polite"><i class="spinner"></i><span>正在搜索</span></div>

  </section>
  <script type="text/plain">
    const data={
      resource:{name:'资源修改',desc:'资源相关操作集中放置，进入后再按需展开。',items:[['资源方案','选择预设'],['快捷调整','打开输入'],['资源摘要','查看状态'],['同步配置','载入方案']]},
      general:{name:'将领修改',desc:'将领资料、属性与编组的紧凑入口。',items:[['将领选择','目标列表'],['属性方案','载入模板'],['编组管理','部队设置'],['方案保存','记录调整']]},
      battle:{name:'局内修改',desc:'局内功能按需显示，不占用战场视野。',items:[['局内资源','资源与势力修改'],['回合工具','快捷控制'],['单位管理','当前单位'],['战场状态','局内摘要']]},
      other:{name:'其他修改',desc:'外观、日志和通用配置管理。',items:[['界面外观','透明度设置'],['运行日志','查看记录'],['配置管理','导入导出'],['关于面板','版本说明']]}
    };
    const detail=document.getElementById('detail'),title=document.getElementById('title'),desc=document.getElementById('desc'),actions=document.getElementById('actions'),back=document.getElementById('back'),loading=document.getElementById('loading'),assetLoader=document.getElementById('asset-loader'),assetState=document.getElementById('asset-state'),assetBar=document.getElementById('asset-bar'),assetCount=document.getElementById('asset-count');
    let touchStart=null,handledTouchButton=null;
    document.addEventListener('touchstart',event=>{const button=event.target.closest&&event.target.closest('button');if(button&&detail.contains(button)){const point=event.changedTouches[0];touchStart={button,x:point.clientX,y:point.clientY}}},false);
    document.addEventListener('touchend',event=>{const button=event.target.closest&&event.target.closest('button');if(!touchStart||button!==touchStart.button)return;const point=event.changedTouches[0],distance=Math.hypot(point.clientX-touchStart.x,point.clientY-touchStart.y);touchStart=null;if(distance>12||typeof button.onclick!=='function')return;event.preventDefault();handledTouchButton=button;button.onclick();},false);
    document.addEventListener('click',event=>{const button=event.target.closest&&event.target.closest('button');if(button&&button===handledTouchButton){event.preventDefault();event.stopImmediatePropagation();handledTouchButton=null}},true);
    if(typeof setButtonImage==='function')setButtonImage('https://raw.githubusercontent.com/61124204/WorldConqueror4-H5GG-HTMLscript/main/assistive-touch.png');
    const rangeStart='0x00000000',rangeEnd='0x200000000',type='I32',key=518867;
    let selectedResource='';
    const encode=value=>(key ^ value)|0;
    const showZoneMenu=()=>{title.textContent='功能分区';desc.textContent='选择需要的修改分区。';back.classList.remove('show');actions.innerHTML=Object.entries(data).map(([zone,z])=>`<button type="button" class="action" data-zone="${zone}"><strong>${z.name}</strong><small>${z.desc}</small></button>`).join('');actions.scrollTop=0;document.querySelectorAll('[data-zone]').forEach(btn=>btn.onclick=()=>showActionList(btn.dataset.zone))};
    const showActionList=zone=>{const z=data[zone];title.textContent=z.name;desc.textContent=z.desc;back.classList.add('show');actions.innerHTML=z.items.map(([a,b],i)=>`<button type="button" class="action" data-item="${i}"><strong>${a}</strong><small>${b}</small></button>`).join('');actions.scrollTop=0;document.querySelectorAll('.action').forEach(btn=>btn.onclick=()=>{if(zone==='battle'&&btn.dataset.item==='0')return showResourceTypeMenu();btn.classList.toggle('on')})};
    const showResourceTypeMenu=()=>{title.textContent='局内资源';desc.textContent='请选择当前需要搜索的资源类型，或进入军团修改。';actions.innerHTML=['金钱','工业','科技'].map(name=>`<button type="button" class="action" data-resource="${name}"><strong>${name}</strong><small>进入势力修改与资源搜索</small></button>`).join('')+'<button type="button" class="action" id="dev-test"><strong>军团修改</strong><small>定位军团资源结构并按 iOS 小端序修改颜色</small></button>';actions.scrollTop=0;document.querySelectorAll('[data-resource]').forEach(btn=>btn.onclick=()=>{selectedResource=btn.dataset.resource;showFactionMenu()});document.getElementById('dev-test').onclick=showDevTargetMenu};

    const verifyGeneralCandidates=(general,total)=>new Promise((resolve,reject)=>{let skip=0;const candidates=[],steps=generalFieldSteps(general),audit=[];const collect=()=>{try{const take=Math.min(180,total-skip),batch=h5gg.getResults(take,skip);batch.forEach(result=>candidates.push(result.address));skip+=batch.length;loadingText.textContent=`读取 ID 候选：${Math.min(skip,total)}/${total}`;if(skip<total&&batch.length)setTimeout(collect,0);else filterStep(0)}catch(error){reject(error)}};const filterStep=index=>{try{if(index>=steps.length)return resolve({matches:candidates,audit});const step=steps[index],before=candidates.length,samples=candidates.slice(0,4).map(address=>({address,actual:readI32(addr(address,step.offset))}));for(let cursor=candidates.length-1;cursor>=0;cursor--)if(readI32(addr(candidates[cursor],step.offset))!==step.value)candidates.splice(cursor,1);audit.push({label:step.label,offset:step.offset,value:step.value,before,after:candidates.length,samples});loadingText.textContent=`偏移识别 ${index+1}/${steps.length}：${step.label} · 剩余 ${candidates.length} 条`;desc.textContent=`${general.name}：${step.label}（ID +0x${step.offset.toString(16).toUpperCase()}）筛选后剩余 ${candidates.length} 条。`;if(!candidates.length)return resolve({matches:[],audit});setTimeout(()=>filterStep(index+1),0)}catch(error){reject(error)}};collect()});
    const returnToGeneralPicker=()=>{const token=++generalNavigationToken;generalMenuOpening=false;generalResultActive=false;if(pageStack.length)pageStack.pop();clearTimeout(generalReturnTimer);generalReturnTimer=setTimeout(()=>{if(token===generalNavigationToken)showGeneralPicker()},60)};
    const showGeneralAutoUpdated=(general,addresses,firstCount,written=true)=>{generalResultActive=true;setPage(()=>showGeneralAutoUpdated(general,addresses,firstCount,written));title.textContent='技能槽修改完成';desc.textContent=`${general.name} 已唯一定位并完成双 5 写入。`;const rows=addresses.map(address=>`<code>${addr(address)}　+0xB0=5　+0xB4=5</code>`).join('<br>');actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>${written?'自动写入完成':'写入失败'}</b><br>首轮 ID 结果：${firstCount} 条<br>${rows}</div><div class="form-actions"><button id="general-return" class="primary" type="button">返回将领选择</button></div></div>`;document.getElementById('general-return').onclick=returnToGeneralPicker};
    const locateGeneral=async general=>{if(generalSearchBusy)return;if(typeof h5gg==='undefined')return message('请在 H5GG 中运行。');generalSearchBusy=true;try{const evaluationValue=({1:3,2:4,3:5})[general.evaluate];h5gg.clearResults();await new Promise(resolve=>setTimeout(resolve,100));h5gg.searchNumber(String(general.id),type,rangeStart,rangeEnd);const idCount=h5gg.getResultsCount();loadingText.textContent=`搜索将领 ID：${idCount} 条`;if(!idCount)return showGeneralLocateResult(general,0,evaluationValue,0,[]);title.textContent='将领定位中';desc.textContent=`将领 ID 搜索得到 ${idCount} 条，正在按固定偏移依次识别属性。`;const verification=await verifyGeneralCandidates(general,idCount),idMatches=verification.matches;if(idMatches.length===1){const idAddress=idMatches[0],b0=addr(idAddress,0xB0n),b4=addr(idAddress,0xB4n),written=h5gg.setValue(b0,'5',type)&&h5gg.setValue(b4,'5',type);return showGeneralAutoUpdated(general,[idAddress],idCount,written)}return showGeneralLocateResult(general,idMatches.length,evaluationValue,idCount,verification.audit)}finally{generalSearchBusy=false;loadingText.textContent='正在搜索'}};
    const showGeneralLocateResult=(general,count,evaluationValue,idCount=0,audit=[])=>{generalResultActive=true;setPage(()=>showGeneralLocateResult(general,count,evaluationValue,idCount,audit));const failed=audit.find(item=>item.after===0),auditRows=audit.map(item=>{const failedRow=item.after===0?' focus':'';const examples=item.after===0?`<br><code>${item.samples.map(sample=>`${sample.address}=${sample.actual}`).join('　')}</code>`:'';return `<div class="memory-row${failedRow}"><b>+0x${item.offset.toString(16).toUpperCase()}</b><span>${item.label}　预设 ${item.value}<br><code>${item.before} → ${item.after} 条</code>${examples}</span></div>`}).join('');title.textContent='将领定位结果';desc.textContent=`${general.name}（${general.id}）偏移核验结果：${count} 条。`;actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>ID → 固定偏移逐项识别</b><br>初始 ID 结果：${idCount} 条。${failed?`<br><b>失败位置：${failed.label}（ID +0x${failed.offset.toString(16).toUpperCase()}）</b>`:'<br>只有唯一候选时才会自动写入双 5。'}<br>蓝色项的“预设/实际”可直接用于核对数据表与内存结构。</div>${auditRows?`<p class="result-note"><b>逐项筛选记录</b></p><div class="memory-list">${auditRows}</div>`:''}<div class="form-actions"><button id="general-return" class="primary" type="button">返回将领选择</button></div></div>`;document.getElementById('general-return').onclick=returnToGeneralPicker};
    const showGeneralLocated=(general,address,evaluationValue,actualEvaluate)=>{generalResultActive=true;setPage(()=>showGeneralLocated(general,address,evaluationValue,actualEvaluate));title.textContent='将领 ID 已定位';desc.textContent=`${general.name} 的唯一 ID 地址已确认。`;actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>${general.name} · ID ${general.id}</b><br>地址：${addr(address)}<br>评价参考：${evaluationValue}　当前读取：${actualEvaluate}</div><div class="form-actions"><button id="general-back" type="button">返回将领选择</button><button id="skill-next" class="primary" type="button">技能槽修改</button></div><p class="result-note">本阶段已完成唯一定位；技能槽写入规则待下一步接入。</p></div>`;document.getElementById('general-back').onclick=returnToGeneralPicker;document.getElementById('skill-next').onclick=()=>openPage(()=>message('将领 ID 已定位，等待技能槽偏移规则。'))};
    const inside=()=>{setPage(inside);title.textContent='局内修改';desc.textContent='按需进入战局功能。';back.classList.add('show');buttons([['资源修改','搜索并定位当前军团资源',resourceMenu],['兵种修改','单位属性与等级',()=>message('兵种修改待接入预设。')],['一键通关','当前战局结束控制',()=>message('一键通关需要单独提供通关标识。')]])};
    const resourceMenu=()=>{setPage(resourceMenu);title.textContent='资源修改';desc.textContent='选择搜索方式。';back.classList.add('show');buttons([['简单搜索','只输入经济数值，可能需要多次过滤',()=>searchForm('simple')],['三项搜索','经济、工业、科技联合过滤，更易唯一定位',()=>searchForm('triple')]])};
    const searchForm=mode=>{setPage(()=>searchForm(mode));searchMode=mode;title.textContent=mode==='simple'?'简单搜索':'三项搜索';desc.textContent=mode==='simple'?'输入当前经济值开始搜索。':'输入当前经济、工业、科技值进行联合过滤。';const fields=mode==='simple'?'<label>当前经济</label><input id="v1" type="number" inputmode="numeric" placeholder="例如：640">':'<label>经济 / 工业 / 科技</label><input id="v1" type="number" inputmode="numeric" placeholder="经济，例如：640"><input id="v2" type="number" inputmode="numeric" placeholder="工业，例如：240"><input id="v3" type="number" inputmode="numeric" placeholder="科技，例如：26">';actions.innerHTML=`<div class="search-form">${fields}<div class="form-actions"><button id="go" class="primary" type="button">开始搜索</button></div><p class="result-note">数值不会显示转换结果。</p></div>`;document.getElementById('go').onclick=()=>openPage(()=>load(()=>startSearch(mode)))};
    const val=id=>Number(document.getElementById(id).value);
    const valid=n=>Number.isInteger(n)&&n>=0&&n<=999999;
    const startSearch=mode=>{if(typeof h5gg==='undefined')return message('请在 H5GG 中运行。');const a=val('v1'),b=mode==='triple'?val('v2'):null,c=mode==='triple'?val('v3'):null;if(!valid(a)||(mode==='triple'&&(!valid(b)||!valid(c))))return message('请输入有效的整数。');h5gg.clearResults();h5gg.searchNumber(String(encode(a)),type,rangeStart,rangeEnd);finishSearch(mode,{a,b,c})};
    const finishSearch=(mode,values)=>{let results=h5gg.getResults(Math.min(h5gg.getResultsCount(),512),0);if(mode==='triple')results=results.filter(r=>readI32(addr(r.address,4n))===encode(values.b)&&readI32(addr(r.address,8n))===encode(values.c));if(results.length===1){located={address:results[0].address,mode,values};return locatedMenu()}if(results.length===0)return message('没有匹配结果，请确认数值或重新搜索。');refineForm(mode,values,results.length)};
    const refineForm=(mode,old,count)=>{setPage(()=>refineForm(mode,old,count));title.textContent='继续过滤';desc.textContent=`当前剩余 ${count} 条，请先在游戏内改变资源后输入新值。`;const fields=mode==='simple'?'<input id="r1" type="number" inputmode="numeric" placeholder="变化后的经济">':'<input id="r1" type="number" inputmode="numeric" placeholder="变化后的经济"><input id="r2" type="number" inputmode="numeric" placeholder="变化后的工业"><input id="r3" type="number" inputmode="numeric" placeholder="变化后的科技">';actions.innerHTML=`<div class="search-form">${fields}<div class="form-actions"><button id="refine" class="primary" type="button">再次搜索</button></div></div>`;document.getElementById('refine').onclick=()=>openPage(()=>load(()=>{const a=val('r1'),b=mode==='triple'?val('r2'):null,c=mode==='triple'?val('r3'):null;if(!valid(a)||(mode==='triple'&&(!valid(b)||!valid(c))))return message('请输入有效的整数。');h5gg.searchNumber(String(encode(a)),type,rangeStart,rangeEnd);finishSearch(mode,{a,b,c})}))};
    const locatedMenu=()=>{setPage(locatedMenu);title.textContent='资源已定位';desc.textContent='已定位经济地址，可选择后续操作。';back.classList.add('show');buttons([['保存地址记录','保存当前定位供后续调用',saveLocated],['资源修改','修改经济、工业、科技',editResources],['阵营修改','地址：经济 - 0x84，范围 0–6',editFaction],['玩家可控','地址：经济 + 0xC，范围 0/1',editControl],['底色修改','iOS 小端序颜色调色板',colorMenu]])};
    const doneAtLocated=text=>{setPage(()=>doneAtLocated(text));title.textContent='操作完成';desc.textContent=text;actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>${text}</b></div><div class="form-actions"><button id="back-located" class="primary" type="button">返回已定位功能</button></div></div>`;document.getElementById('back-located').onclick=goBack};
    const saveLocated=()=>{records.unshift({address:located.address,mode:located.mode,time:new Date().toLocaleString()});saveRecords();doneAtLocated('地址记录已保存。')};
    const editResources=()=>{const a=prompt('经济新值：',String(located.values.a||''));if(a===null)return;const b=prompt('工业新值：',located.mode==='triple'?String(located.values.b):'');if(b===null)return;const c=prompt('科技新值：',located.mode==='triple'?String(located.values.c):'');if(c===null)return;const values=[Number(a),Number(b),Number(c)];if(values.some(x=>!valid(x)))return doneAtLocated('请输入有效资源数值。');if(typeof h5gg==='undefined')return doneAtLocated('请在 H5GG 中运行。');h5gg.setValue(located.address,String(encode(values[0])),type);h5gg.setValue(addr(located.address,4n),String(encode(values[1])),type);h5gg.setValue(addr(located.address,8n),String(encode(values[2])),type);doneAtLocated('资源已写入。')};
    const editFaction=()=>{const value=Number(prompt('阵营值（0–6）：','0'));if(!Number.isInteger(value)||value<0||value>6)return doneAtLocated('阵营值只能是 0–6。');h5gg.setValue(addr(located.address,-0x84n),String(value),type);doneAtLocated('阵营已写入。')};

    const colorMenu=()=>{setPage(colorMenu);title.textContent='底色修改';desc.textContent='选择颜色，写入会自动转换为 iOS 小端序。';actions.innerHTML=`<div class="search-form"><div id="palette" style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px">${palette.map(c=>`<button type="button" data-color="${c}" title="${c}" style="height:28px;border:1px solid rgba(255,255,255,.35);border-radius:9px;background:${c}"></button>`).join('')}</div><div class="form-actions" style="margin-top:9px"><button id="color-back" type="button">返回已定位功能</button><button id="custom-color" class="primary" type="button">自定义颜色</button></div></div>`;document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>writeColor(b.dataset.color));document.getElementById('color-back').onclick=goBack;document.getElementById('custom-color').onclick=()=>{const c=prompt('输入 #RRGGBB：','#B48750');if(c&&/^#[0-9a-fA-F]{6}$/.test(c))writeColor(c.toUpperCase());else if(c)doneAtLocated('颜色格式应为 #RRGGBB。')}};

    const recordMenu=()=>{setPage(recordMenu);title.textContent='修改记录';desc.textContent='点击记录可重新打开对应操作。';back.classList.add('show');if(!records.length)return message('暂无已保存地址记录。',true);buttons(records.map((r,i)=>[`记录 ${i+1}`,`${r.address} · ${r.time}`,()=>{located={address:r.address,mode:r.mode||'simple',values:{}};locatedMenu()}]))};
    const message=(text,keep)=>{setPage(()=>message(text,keep));title.textContent='提示';desc.textContent=text;actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>${text}</b></div><div class="form-actions"><button id="ok" class="primary" type="button">返回</button></div></div>`;document.getElementById('ok').onclick=goBack};
    const soundUrls={select:'',cancel:'',click:''},soundPlayers={};let soundsUnlocked=false,soundUnlocking=false;

    const playSound=kind=>{if(!soundUrls[kind])return;try{primeSounds();const player=soundPlayers[kind];if(!player)return;player.currentTime=0;const play=player.play();if(play)play.catch(()=>{})}catch(error){}};
    const playButtonSound=button=>{if(!button)return;const isReturn=button.id==='back'||button.textContent.includes('返回');playSound(button.id==='minimize'?'click':isReturn?'cancel':'select')};
    const open=()=>{if(typeof setWindowVisible==='function')setWindowVisible(true);if(typeof setWindowTouch==='function')setWindowTouch(true);detail.classList.add('open')};
    const minimize=()=>{detail.classList.remove('open');if(typeof setWindowTouch==='function')setWindowTouch(false)};
    const close=()=>{detail.classList.remove('open');if(typeof setWindowTouch==='function')setWindowTouch(false);try{if(typeof h5gg!=='undefined')h5gg.clearResults()}catch(e){}setTimeout(()=>{try{window.location.reload()}catch(e){location.href=location.href}},120)};
    let touchStart=null,handledTouchButton=null;
    document.addEventListener('touchstart',event=>{unlockSounds();const button=event.target.closest&&event.target.closest('button');if(button&&detail.contains(button)){const point=event.changedTouches[0];touchStart={button,x:point.clientX,y:point.clientY}}},false);
    document.addEventListener('mousedown',unlockSounds,{passive:true});

    document.addEventListener('click',event=>{const button=event.target.closest&&event.target.closest('button');if(button&&button===handledTouchButton){event.preventDefault();event.stopImmediatePropagation();handledTouchButton=null}else if(button&&detail.contains(button))playButtonSound(button)},true);
