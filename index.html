<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iOS 浮球菜单预览</title>
  <style>
    :root{--glass:rgba(35,40,53,.72);--glass-2:rgba(37,43,58,.91);--line:rgba(255,255,255,.17);--text:#f5f7fc;--muted:#b4bac8;--blue:#4da3ff;--green:#51d394}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Microsoft YaHei",sans-serif;color:var(--text);-webkit-user-select:none;user-select:none}
    .detail{position:absolute;right:12px;top:50%;width:min(300px,calc(100vw - 24px));height:286px;padding:8px;border:1px solid rgba(113,197,255,.34);border-radius:25px;background:linear-gradient(145deg,rgba(44,52,71,.91),rgba(24,30,44,.94));box-shadow:0 20px 48px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.2),0 0 23px rgba(77,163,255,.16);backdrop-filter:blur(22px) saturate(135%);opacity:0;pointer-events:none;transform:translateY(-50%) translateX(10px) scale(.97);transition:.2s ease}.detail:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent)}.detail.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
    .loading{position:absolute;inset:0;z-index:5;display:grid;place-content:center;gap:10px;border-radius:25px;background:rgba(20,27,40,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .16s}.loading.show{opacity:1;pointer-events:auto}.spinner{width:34px;height:34px;margin:auto;border:3px solid rgba(255,255,255,.18);border-top-color:var(--blue);border-right-color:#a49bff;border-radius:50%;animation:spin .75s linear infinite}.loading span{font-size:11px;color:#dcecff;letter-spacing:.08em}@keyframes spin{to{transform:rotate(360deg)}}
    .detail-head{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 7px}.detail-head h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.02em}.head-actions{display:flex;gap:6px}.head-actions button{width:24px;height:24px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.09);color:var(--muted);font-size:17px;line-height:18px;cursor:pointer}.head-actions #back{display:none;font-size:16px}.head-actions #back.show{display:block}.head-actions #exit:hover{border-color:rgba(255,111,111,.55);color:#ffb2b2;background:rgba(255,95,95,.12)}.desc{margin:0;padding:0 10px 8px;color:var(--muted);font-size:11px}.actions{max-height:206px;overflow-y:auto;padding-right:3px;scroll-snap-type:y mandatory;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}.actions::-webkit-scrollbar{width:4px}.actions::-webkit-scrollbar-thumb{border-radius:8px;background:rgba(255,255,255,.3)}.action{position:relative;display:block;width:100%;min-height:58px;margin-bottom:7px;padding:10px 43px 10px 48px;border:1px solid rgba(255,255,255,.13);border-radius:17px;background:rgba(10,14,25,.22);color:var(--text);text-align:left;cursor:pointer;scroll-snap-align:start;transition:.16s}.action:last-child{margin-bottom:0}.action:before{content:"";position:absolute;left:13px;top:50%;width:26px;height:26px;transform:translateY(-50%);border-radius:9px;background:linear-gradient(145deg,rgba(92,174,255,.95),rgba(93,115,238,.9));box-shadow:inset 0 1px rgba(255,255,255,.34)}.action:nth-child(2):before{background:linear-gradient(145deg,#ffb455,#ee7f5a)}.action:nth-child(3):before{background:linear-gradient(145deg,#5be2ae,#2dba91)}.action:nth-child(4):before{background:linear-gradient(145deg,#b28aff,#7764df)}.action:after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-52%);color:#aeb6c5;font-size:22px;font-weight:300}.action:hover{background:rgba(255,255,255,.09)}.action.on{border-color:rgba(77,163,255,.6);background:rgba(77,163,255,.14)}.action.on:after{content:"✓";color:var(--green);font-size:14px;font-weight:700}.action strong{display:block;font-size:13px;font-weight:550}.action small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.action.on small{color:#bddcff}.action.on small:after{content:" · 已启用";color:var(--green)}
    .search-form{padding:1px}.search-form label{display:block;margin:0 2px 7px;color:var(--muted);font-size:11px}.search-form input{width:100%;height:39px;padding:0 12px;border:1px solid rgba(255,255,255,.17);border-radius:13px;outline:0;background:rgba(9,13,24,.38);color:var(--text);font:inherit;font-size:13px;-webkit-user-select:text;user-select:text}.search-form input:focus{border-color:rgba(77,163,255,.7);box-shadow:0 0 0 3px rgba(77,163,255,.12)}.convert-preview{margin:8px 1px 9px;padding:9px 11px;border-radius:13px;background:rgba(77,163,255,.1);color:#c8e3ff;font-size:11px}.convert-preview b{color:#fff;font-weight:600}.form-actions{display:flex;gap:7px}.form-actions button{flex:1;height:35px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.12);color:var(--text);font-size:11px;cursor:pointer}.form-actions button.primary{border-color:rgba(77,163,255,.52);background:linear-gradient(135deg,#438fe3,#6463d8)}.result-note{margin:8px 2px 0;color:var(--muted);font-size:11px}.result-note b{color:var(--text)}
    @media(max-width:500px){.detail{right:12px;width:calc(100vw - 24px)}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <section class="detail" id="detail" aria-live="polite">
    <header class="detail-head"><h1 id="title">功能分区</h1><div class="head-actions"><button id="back" type="button" aria-label="返回">‹</button><button id="exit" type="button" aria-label="退出">×</button></div></header>
    <p class="desc" id="desc"></p>
    <main class="actions" id="actions" aria-label="上下滑动选择功能"></main>
    <div class="loading" id="loading" aria-live="polite"><i class="spinner"></i><span>正在搜索</span></div>
  </section>
  <script>
    const data={
      resource:{name:'资源修改',desc:'资源相关操作集中放置，进入后再按需展开。',items:[['资源方案','选择预设'],['快捷调整','打开输入'],['资源摘要','查看状态'],['同步配置','载入方案']]},
      general:{name:'将领修改',desc:'将领资料、属性与编组的紧凑入口。',items:[['将领选择','目标列表'],['属性方案','载入模板'],['编组管理','部队设置'],['方案保存','记录调整']]},
      battle:{name:'局内修改',desc:'局内功能按需显示，不占用战场视野。',items:[['局内资源','资源与势力修改'],['回合工具','快捷控制'],['单位管理','当前单位'],['战场状态','局内摘要']]},
      other:{name:'其他修改',desc:'外观、日志和通用配置管理。',items:[['界面外观','透明度设置'],['运行日志','查看记录'],['配置管理','导入导出'],['关于面板','版本说明']]}
    };
    const detail=document.getElementById('detail'),title=document.getElementById('title'),desc=document.getElementById('desc'),actions=document.getElementById('actions'),back=document.getElementById('back'),loading=document.getElementById('loading');
    let touchStart=null,handledTouchButton=null;
    document.addEventListener('touchstart',event=>{const button=event.target.closest&&event.target.closest('button');if(button&&detail.contains(button)){const point=event.changedTouches[0];touchStart={button,x:point.clientX,y:point.clientY}}},false);
    document.addEventListener('touchend',event=>{const button=event.target.closest&&event.target.closest('button');if(!touchStart||button!==touchStart.button)return;const point=event.changedTouches[0],distance=Math.hypot(point.clientX-touchStart.x,point.clientY-touchStart.y);touchStart=null;if(distance>12||typeof button.onclick!=='function')return;event.preventDefault();handledTouchButton=button;button.onclick();},false);
    document.addEventListener('click',event=>{const button=event.target.closest&&event.target.closest('button');if(button&&button===handledTouchButton){event.preventDefault();event.stopImmediatePropagation();handledTouchButton=null}},true);
    if(typeof setButtonImage==='function')setButtonImage('https://raw.githubusercontent.com/61124204/WorldConqueror4-H5GG-HTMLscript/main/assistive-touch.png');
    const rangeStart='0x00000000',rangeEnd='0x200000000',type='I32',key=518867;
    let selectedResource='';
    const encode=value=>(key ^ value)|0;
    const showZoneMenu=()=>{title.textContent='功能分区';desc.textContent='选择需要的修改分区。';back.classList.remove('show');actions.innerHTML=Object.entries(data).map(([zone,z])=>`<button type="button" class="action" data-zone="${zone}"><strong>${z.name}</strong><small>${z.desc}</small></button>`).join('');actions.scrollTop=0;document.querySelectorAll('[data-zone]').forEach(btn=>btn.onclick=()=>showActionList(btn.dataset.zone))};
    const showActionList=zone=>{const z=data[zone];title.textContent=z.name;desc.textContent=z.desc;back.classList.add('show');actions.innerHTML=z.items.map(([a,b],i)=>`<button type="button" class="action" data-item="${i}"><strong>${a}</strong><small>${b}</small></button>`).join('');actions.scrollTop=0;document.querySelectorAll('.action').forEach(btn=>btn.onclick=()=>{if(zone==='battle'&&btn.dataset.item==='0')return showResourceTypeMenu();btn.classList.toggle('on')})};
    const showResourceTypeMenu=()=>{title.textContent='局内资源';desc.textContent='请选择当前需要搜索的资源类型，或运行预设地址测试。';actions.innerHTML=['金钱','工业','科技'].map(name=>`<button type="button" class="action" data-resource="${name}"><strong>${name}</strong><small>进入势力修改与资源搜索</small></button>`).join('')+'<button type="button" class="action" id="dev-test"><strong>开发测试</strong><small>黑蝎与苏联：定位资源、颜色与 AI 控制候选</small></button>';actions.scrollTop=0;document.querySelectorAll('[data-resource]').forEach(btn=>btn.onclick=()=>{selectedResource=btn.dataset.resource;showFactionMenu()});document.getElementById('dev-test').onclick=showDevTargetMenu};
    const showFactionMenu=()=>{title.textContent=`${selectedResource} · 势力修改`;desc.textContent='选择要进行的势力相关操作。';actions.innerHTML='<button type="button" class="action" id="resource-search"><strong>资源搜索</strong><small>输入局内显示数值后自动转换并搜索</small></button>';document.getElementById('resource-search').onclick=showResourceSearch};
    const runWithLoading=task=>{loading.classList.add('show');setTimeout(()=>{try{task()}finally{loading.classList.remove('show')}},360)};
    const showResourceSearch=()=>{title.textContent=`${selectedResource} · 资源搜索`;desc.textContent=`输入游戏内当前显示的${selectedResource}数值。`;actions.innerHTML=`<div class="search-form"><label for="game-value">游戏内当前${selectedResource}数值</label><input id="game-value" type="number" inputmode="numeric" min="0" max="9999" placeholder="例如：500"><div class="form-actions"><button id="back-to-faction" type="button">返回</button><button class="primary" id="start-search" type="button">搜索</button></div><p class="result-note" id="search-note">仅支持 0–9999 的整数。</p></div>`;const input=document.getElementById('game-value');document.getElementById('back-to-faction').onclick=showFactionMenu;document.getElementById('start-search').onclick=()=>runWithLoading(()=>searchResource(input.value))};
    const searchResource=raw=>{const value=Number(raw);const note=document.getElementById('search-note');if(!Number.isInteger(value)||value<0||value>9999){note.innerHTML='<b>请输入 0–9999 的整数。</b>';return}const encoded=encode(value);if(typeof h5gg==='undefined'){note.innerHTML='<b>预览模式：</b>请在 H5GG 中运行以执行内存搜索。';return}try{h5gg.clearResults();h5gg.searchNumber(String(encoded),type,rangeStart,rangeEnd);const count=h5gg.getResultsCount();showSearchOutcome(count)}catch(error){note.innerHTML=`<b>搜索失败：</b>${error.message||error}`}};
    const showSearchOutcome=count=>{title.textContent=`${selectedResource} · 搜索结果`;desc.textContent=`I32 搜索结果：${count} 条。`;if(count===1){actions.innerHTML='<div class="search-form"><div class="convert-preview"><b>已定位唯一结果，可直接修改。</b></div><div class="form-actions"><button id="modify-one" class="primary" type="button">直接修改</button></div></div>';document.getElementById('modify-one').onclick=()=>modifyResults(1);return}actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>当前结果 ${count} 条，尚未唯一定位。</b></div><div class="form-actions"><button id="modify-many" type="button">直接修改</button><button id="refine-search" class="primary" type="button">二次搜索</button></div><p class="result-note">二次搜索前，请先在游戏内改变该资源值。</p></div>`;document.getElementById('modify-many').onclick=()=>modifyResults(count);document.getElementById('refine-search').onclick=showRefineSearch};
    const showRefineSearch=()=>{title.textContent=`${selectedResource} · 二次搜索`;desc.textContent=`先在游戏内改变${selectedResource}，再输入变化后的显示数值。`;actions.innerHTML=`<div class="search-form"><label for="next-value">变化后的游戏内${selectedResource}数值</label><input id="next-value" type="number" inputmode="numeric" min="0" max="9999" placeholder="例如：480"><div class="form-actions"><button id="refine" class="primary" type="button">二次搜索</button></div></div>`;const input=document.getElementById('next-value');document.getElementById('refine').onclick=()=>runWithLoading(()=>{const value=Number(input.value);if(!Number.isInteger(value)||value<0||value>9999)return alert('请输入 0–9999 的整数。');if(typeof h5gg==='undefined')return alert('请在 H5GG 中运行以执行二次搜索。');h5gg.searchNumber(String(encode(value)),type,rangeStart,rangeEnd);showSearchOutcome(h5gg.getResultsCount())})};
    const modifyResults=count=>{const target=prompt(`当前将修改 ${count} 条结果。\n请输入希望在游戏内显示的新资源数值（0–9999）：`);if(target===null)return;const value=Number(target);if(!Number.isInteger(value)||value<0||value>9999)return alert('请输入 0–9999 的整数。');const encoded=encode(value);if(typeof h5gg==='undefined')return alert(`预览模式：将写入 I32 值 ${encoded}。`);const changed=h5gg.editAll(String(encoded),type);alert(`已修改 ${changed} 条结果。`)};
    const devProfiles={black:{name:'黑蝎部队',money:1000,industry:500,technology:200,color:'#8C8CC8'},soviet:{name:'苏联',money:660,industry:320,technology:28,color:'#F0AAAA'}};
    let devCalibration={};
    const formatOffset=value=>{const sign=value<0n?'-':'+';const absolute=value<0n?-value:value;return `${sign}${absolute.toString()} (${sign}0x${absolute.toString(16).toUpperCase()})`};
    const getResults=count=>h5gg.getResults(Math.min(Number(count),512),0);
    const findClosestPair=(moneyAddresses,colorAddresses)=>{let best=null;moneyAddresses.forEach(money=>colorAddresses.forEach(color=>{try{const offset=BigInt(color)-BigInt(money),distance=offset<0n?-offset:offset;if(!best||distance<best.distance)best={money,color,offset,distance}}catch(error){}}));return best};
    const searchProfile=profile=>{h5gg.clearResults();h5gg.searchNumber(String(encode(profile.money)),type,rangeStart,rangeEnd);const moneyCount=h5gg.getResultsCount(),moneyAddresses=getResults(moneyCount).map(result=>result.address);const rgb=parseInt(profile.color.slice(1),16),argb=0xFF000000|rgb,rgba=0xFF000000|((rgb&0xFF)<<16)|(rgb&0xFF00)|((rgb>>16)&0xFF);let colorCount=0,colorAddresses=[];[rgb,argb,rgba].forEach(value=>{h5gg.clearResults();h5gg.searchNumber(String(value),type,rangeStart,rangeEnd);const count=h5gg.getResultsCount();colorCount+=count;colorAddresses=colorAddresses.concat(getResults(count).map(result=>result.address))});return {profile,moneyCount,colorCount,pair:findClosestPair(moneyAddresses,colorAddresses)}};
    const scanBinaryRange=pair=>{const money=BigInt(pair.money),color=BigInt(pair.color),start=money<color?money:color,end=(money<color?color:money)+4n;h5gg.clearResults();h5gg.searchNumber('0~1',type,'0x'+start.toString(16),'0x'+end.toString(16));const values=new Map();getResults(h5gg.getResultsCount()).forEach(result=>{const value=Number(result.value);if(value===0||value===1)values.set((BigInt(result.address)-money).toString(),value)});return values};
    const compareBinaryFields=()=>{const black=devCalibration.black,soviet=devCalibration.soviet;if(!black?.pair||!soviet?.pair)return[];const a=scanBinaryRange(black.pair),b=scanBinaryRange(soviet.pair),candidates=[];a.forEach((blackValue,offset)=>{const sovietValue=b.get(offset);if((blackValue===0&&sovietValue===1)||(blackValue===1&&sovietValue===0))candidates.push({offset:BigInt(offset),blackValue,sovietValue})});return candidates.sort((x,y)=>x.offset<y.offset?-1:x.offset>y.offset?1:0)};
    const showDevTargetMenu=()=>{title.textContent='开发测试';desc.textContent='先检索黑蝎，再选择苏联完成同偏移 0/1 比对。';actions.innerHTML=Object.entries(devProfiles).map(([key,p])=>`<button type="button" class="action" data-dev="${key}"><strong>${p.name}</strong><small>金钱 ${p.money} · 颜色 ${p.color}</small></button>`).join('');actions.scrollTop=0;document.querySelectorAll('[data-dev]').forEach(btn=>btn.onclick=()=>showDevProfile(devProfiles[btn.dataset.dev],btn.dataset.dev))};
    const showDevProfile=(profile,key)=>{title.textContent=`开发测试 · ${profile.name}`;desc.textContent=key==='soviet'&&!devCalibration.black?'请先完成黑蝎检索，才能进行同偏移比对。':'定位金钱与国家颜色地址；不会修改游戏数值。';const disabled=key==='soviet'&&!devCalibration.black;actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>${profile.name}</b><br>金钱 ${profile.money}　工业 ${profile.industry}　科技 ${profile.technology}<br>国家颜色 ${profile.color}</div><div class="form-actions"><button id="dev-back" type="button">返回</button><button id="run-dev-test" class="primary" type="button" ${disabled?'disabled':''}>开始检索</button></div></div>`;document.getElementById('dev-back').onclick=showDevTargetMenu;if(!disabled)document.getElementById('run-dev-test').onclick=()=>runWithLoading(()=>runDevProfile(profile,key))};
    const runDevProfile=(profile,key)=>{if(typeof h5gg==='undefined')return showDevResult({preview:true});try{const result=searchProfile(profile);devCalibration[key]=result;if(key==='soviet')result.candidates=compareBinaryFields();showDevResult(result,key)}catch(error){showDevResult({error:error.message||String(error)},key)}};
    const showDevResult=(result,key)=>{title.textContent='开发测试结果';if(result.preview){desc.textContent='当前为浏览器预览，无法读取进程内存。';actions.innerHTML='<div class="search-form"><div class="convert-preview"><b>请在 H5GG 中运行后再检索。</b></div><div class="form-actions"><button id="dev-retry" class="primary" type="button">返回测试</button></div></div>';document.getElementById('dev-retry').onclick=showDevTargetMenu;return}if(result.error){desc.textContent='检索过程中出现错误。';actions.innerHTML=`<div class="search-form"><div class="convert-preview"><b>检索失败：</b>${result.error}</div><div class="form-actions"><button id="dev-retry" class="primary" type="button">重试</button></div></div>`;document.getElementById('dev-retry').onclick=()=>showDevProfile(devProfiles[key],key);return}desc.textContent=`${result.profile.name}的金钱与颜色地址已完成检索。`;let content=`<div class="convert-preview"><b>金钱结果：</b>${result.moneyCount} 条<br><b>颜色结果：</b>${result.colorCount} 条</div>`;if(result.pair)content+=`<p class="result-note"><b>颜色 − 金钱偏移</b><br>${formatOffset(result.pair.offset)}</p>`;else content+='<p class="result-note"><b>未能配对地址。</b></p>';if(key==='soviet'&&result.pair){const list=result.candidates||[];content+=`<p class="result-note"><b>AI 控制候选（同偏移 0/1）：${list.length} 项</b>${list.slice(0,12).map(item=>`<br>偏移 ${formatOffset(item.offset)}：黑蝎 ${item.blackValue} / 苏联 ${item.sovietValue}`).join('')||'<br>未找到候选项'}</p>`}const next=key==='black'&&result.pair?'<button id="dev-next" class="primary" type="button">继续检索苏联</button>':'<button id="dev-back" class="primary" type="button">返回</button>';actions.innerHTML=`<div class="search-form">${content}<div class="form-actions"><button id="dev-retry" type="button">再次检索</button>${next}</div></div>`;document.getElementById('dev-retry').onclick=()=>runWithLoading(()=>runDevProfile(devProfiles[key],key));const nextButton=document.getElementById('dev-next');if(nextButton)nextButton.onclick=()=>showDevProfile(devProfiles.soviet,'soviet');else document.getElementById('dev-back').onclick=showDevTargetMenu};
    const openPanel=()=>{if(typeof setWindowVisible==='function')setWindowVisible(true);if(typeof setWindowTouch==='function')setWindowTouch(true);detail.classList.add('open')};
    back.onclick=showZoneMenu;
    document.getElementById('exit').onclick=()=>{detail.classList.remove('open');if(typeof setWindowTouch==='function')setWindowTouch(false)};
    if(typeof setButtonAction==='function')setButtonAction(openPanel);
    showZoneMenu();openPanel();
  </script>
</body>
</html>
